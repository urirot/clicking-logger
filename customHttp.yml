customHeaders:
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  # Same treatment as index.html: it is a document that gets corrected, and the
  # store listings point at it by URL, so a cached copy is the one thing it must
  # not be.
  - pattern: '/privacy.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
      - key: 'Service-Worker-Allowed'
        value: '/'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: 'Content-Type'
        value: 'application/manifest+json'
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '**/*.@(js|css)'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '**/*.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
